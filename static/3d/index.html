<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>David Ayala — 3D</title>
  <meta name="robots" content="noindex" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; touch-action: none; }
    canvas { display: block; }

    #crosshair {
      position: fixed; top: 50%; left: 50%; width: 6px; height: 6px;
      margin: -3px 0 0 -3px; border-radius: 50%; background: #fff;
      opacity: 0.8; pointer-events: none; z-index: 5;
    }
    body.is-touch #crosshair { display: none; }

    #hud {
      position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 18px 10px;
      color: #eee; font-size: 13px; letter-spacing: .02em;
      background: linear-gradient(transparent, rgba(0,0,0,.6));
      pointer-events: none; z-index: 5;
    }
    #controls-hint {
      display: block; margin-top: 4px; color: #9a9aa5; font-size: 11.5px; letter-spacing: .03em;
    }

    #minimap {
      position: fixed; top: 14px; right: 14px; width: 150px; height: 150px;
      border-radius: 8px; z-index: 5; pointer-events: none;
      box-shadow: 0 2px 10px rgba(0,0,0,.4);
    }

    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #07070a; color: #6b7280; font-size: .85rem; letter-spacing: .1em;
      text-transform: uppercase; z-index: 20;
    }
    #loading.hidden { display: none; }

    /* touch controls */
    #touch-move, #touch-look {
      position: fixed; bottom: 0; top: 0; z-index: 6; display: none;
    }
    #touch-move { left: 0; width: 42%; }
    #touch-look { right: 0; width: 58%; }
    body.is-touch #touch-move, body.is-touch #touch-look { display: block; }

    #touch-stick-base {
      position: fixed; left: 24px; bottom: 24px; width: 100px; height: 100px;
      border-radius: 50%; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2);
      z-index: 7; display: none;
    }
    body.is-touch #touch-stick-base { display: block; }
    #touch-stick {
      position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
      border-radius: 50%; background: rgba(232,93,74,.85); opacity: .5;
      transition: opacity .15s;
    }
  </style>
</head>
<body>

  <div id="loading">Carregant galeria&hellip;</div>

  <div id="crosshair"></div>
  <div id="hud">
    <span id="hud-label">Central Plaza</span>
    <span id="controls-hint"></span>
  </div>
  <canvas id="minimap" width="150" height="150"></canvas>

  <div id="touch-move"></div>
  <div id="touch-look"></div>
  <div id="touch-stick-base"><div id="touch-stick"></div></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
