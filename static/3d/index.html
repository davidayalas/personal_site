<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>David Ayala — 3D</title>
  <meta name="robots" content="noindex" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; touch-action: none; }
    canvas { display: block; }

    #crosshair {
      position: fixed; top: 50%; left: 50%; width: 6px; height: 6px;
      margin: -3px 0 0 -3px; border-radius: 50%; background: #fff;
      opacity: 0.8; pointer-events: none; z-index: 5;
    }
    body.is-touch #crosshair { display: none; }

    #hud {
      position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 18px 10px;
      color: #eee; font-size: 13px; letter-spacing: .02em;
      background: linear-gradient(transparent, rgba(0,0,0,.6));
      pointer-events: none; z-index: 5;
    }
    #controls-hint {
      display: block; margin-top: 4px; color: #9a9aa5; font-size: 11.5px; letter-spacing: .03em;
    }

    #minimap {
      position: fixed; top: 14px; right: 14px; width: 150px; height: 150px;
      border-radius: 8px; z-index: 5; pointer-events: none;
      box-shadow: 0 2px 10px rgba(0,0,0,.4);
    }

    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #07070a; color: #6b7280; font-size: .85rem; letter-spacing: .1em;
      text-transform: uppercase; z-index: 20;
    }
    #loading.hidden { display: none; }

    /* touch controls: drag anywhere to look around, street-view style */
    #touch-look {
      position: fixed; inset: 0; z-index: 6; display: none;
    }
    body.is-touch #touch-look { display: block; }

    /* street-view style navigation: stepping happens via floor arrows tapped
       in the 3D view itself; these two on-screen controls just pick a room
       from the plaza and offer a quick way back to it. Anchored above the HUD
       hint text at the very bottom, which can wrap onto two lines on narrow
       screens */
    #nav-controls {
      position: fixed; left: 0; right: 0; bottom: 84px; z-index: 9;
      display: none; justify-content: center; pointer-events: none;
    }
    body.is-touch #nav-controls { display: flex; }

    #nav-controls button {
      pointer-events: auto; font: 600 14px system-ui, sans-serif; color: #eee;
      background: rgba(20,20,26,.72); border: 1px solid rgba(255,255,255,.28);
      border-radius: 999px; backdrop-filter: blur(2px);
    }

    #nav-hub { display: none; gap: 10px; }
    #nav-hub.visible { display: flex; }
    #nav-hub { flex-wrap: wrap; justify-content: center; max-width: 90vw; row-gap: 8px; }
    #nav-hub button { padding: 9px 16px; font-size: 13px; }

    #nav-home {
      position: fixed; left: 16px; bottom: 84px; z-index: 9; display: none;
      width: 44px; height: 44px; padding: 0; border-radius: 50%; font-size: 19px;
    }
    #nav-home.visible { display: block; }
  </style>
</head>
<body>

  <div id="loading">Carregant galeria&hellip;</div>

  <div id="crosshair"></div>
  <div id="hud">
    <span id="hud-label">Central Plaza</span>
    <span id="controls-hint"></span>
  </div>
  <canvas id="minimap" width="150" height="150"></canvas>

  <div id="touch-look"></div>

  <button id="nav-home" type="button" aria-label="Torna a la plaça">⌂</button>
  <div id="nav-controls">
    <div id="nav-hub"></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
